name: Build Extension

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npx vite build

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension zip
        run: cd dist && zip -r ../yomitan-copilot-companion-v${{ steps.version.outputs.version }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: yomitan-copilot-companion-v${{ steps.version.outputs.version }}
          path: yomitan-copilot-companion-v${{ steps.version.outputs.version }}.zip
          retention-days: 90
